id: news_qnmlgb_daily
section: news
display_name: "瓦斯阅读 / 早报"
enabled: true
interval: weekly
fetcher:
  type: http
  url: https://qnmlgb.tech/daily
  headers:
    Accept-Language: zh-CN,zh;q=0.9
  timeout_sec: 30
extractor:
  type: xpath
  item_selector: "//div[contains(@class,'ae') and .//a]"
  fields:
    title: ".//span[contains(@class,'pretty_v2')]/text()"
    url: ".//a/@href"
    summary: ".//span[contains(@class,'pretty_v2')]/text()"
    source_id: "./@data-id"
mapping:
  source: "瓦斯阅读"
  source_id:
    expr: "./@data-id"
limit:
  raw: 30
  top: 14
