id: news_qnmlgb_daily
section: news
display_name: "瓦斯阅读 / 早报"
enabled: true
interval: weekly
fetcher:
  type: http
  url: https://qnmlgb.tech/daily
  headers:
    Accept-Language: zh-CN,zh;q=0.9
  timeout_sec: 30
extractor:
  type: xpath
  # qnmlgb.tech 是扁平 div 列表，没 href/data-id 的容器是装饰壳。只匹配"含 <a> 且 data-id 存在"的 row
  # 双重限定防嵌套容器被多次命中（XPathExtractor 会对每个祖先 div 都创建一条）
  item_selector: "//div[contains(@class,'ae') and ./a and @data-id and .//span[contains(@class,'pretty_v2')]]"
  fields:
    title: ".//span[contains(@class,'pretty_v2')]/text()"
    url: "./a/@href"
    summary: ".//span[contains(@class,'pretty_v2')]/text()"
    source_id: "./@data-id"
mapping:
  source: "瓦斯阅读"
  source_id:
    expr: "./@data-id"
limit:
  raw: 500
