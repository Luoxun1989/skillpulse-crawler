id: project_aihot_products
section: project
display_name: "AIHOT AI 产品（aihot.news/?category=ai-products）"
enabled: true
interval: weekly
fetcher:
  type: playwright
  url: https://aihot.news/?category=ai-products&page=1
  headers:
    Accept-Language: zh-CN,zh;q=0.9
  timeout_sec: 45
extractor:
  type: xpath
  item_selector: "//article[.//a[contains(@href,'/items/')]]"
  fields:
    title: ".//span[contains(@class,'uc-x-title')]/text() | .//h2/text() | .//h3/text() | .//a[1]/text()"
    url: ".//a[contains(@href,'/items/')]/@href"
    summary: ".//p/text()"
    source_id: ".//@data-item-id"
mapping:
  source: "AIHOT"
  source_id:
    expr: ".//@data-item-id"
  url_template: "https://aihot.news{url}"
limit:
  raw: 500
