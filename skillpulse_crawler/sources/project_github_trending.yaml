id: project_github_trending
section: project
display_name: "GitHub Trending"
enabled: false  # 2026-09-22 禁用：未配置 GITHUB_TOKEN，且被 open_itc 覆盖
interval: weekly
fetcher:
  type: api
  url: https://api.github.com/search/repositories?q=ai+skills&sort=stars&order=desc
  headers:
    Accept: application/vnd.github+json
extractor:
  type: jsonpath
  item_selector: "$.items[*]"
  fields:
    title: "$.full_name"
    url: "$.html_url"
    source_id: "$.full_name"
    stars: "$.stargazers_count"
mapping:
  source: "GitHub"
  source_id:
    expr: "$.full_name"
limit:
  raw: 500
