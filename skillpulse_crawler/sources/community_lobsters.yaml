id: community_lobsters
section: community
display_name: "Lobsters 社区热帖"
enabled: true
interval: weekly
fetcher:
  type: http
  url: https://lobste.rs/
  headers:
    Accept-Language: zh-CN,zh;q=0.9
  timeout_sec: 30
extractor:
  type: xpath
  item_selector: "//div[contains(@class,'story_liner') and contains(@class,'h-entry') and .//a[contains(@class,'u-url')][starts-with(@href,'http')]]"
  fields:
    title: ".//a[contains(@class,'u-url')]/text()"
    url: ".//a[contains(@class,'u-url')]/@href"
    summary: ".//a[contains(@class,'domain')]/text()"
    source_id: ".//a[contains(@class,'u-url')]/@href"
    likes_count: ".//*[contains(@class,'voters')]/text()"
    published_date: ".//time/@datetime"
mapping:
  source: "Lobsters"
  source_id:
    expr: ".//a[contains(@class,'u-url')]/@href"
limit:
  raw: 500
