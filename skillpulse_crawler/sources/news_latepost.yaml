id: news_latepost
section: news
display_name: "晚点 LatePost 独家报道"
enabled: true
interval: weekly
fetcher:
  type: http
  url: https://www.latepost.com/
  headers:
    Accept-Language: zh-CN,zh;q=0.9
  timeout_sec: 30
  verify_ssl: false   # SSL 证书异常，verify=False 绕过
extractor:
  type: xpath
  item_selector: "//a[contains(@href,'/news/dj_detail')]"
  fields:
    title: "./text()"
    url: "./@href"
    source_id: "./@href"
mapping:
  source: "晚点 LatePost"
  source_id:
    expr: "./@href"
  url_template: "https://www.latepost.com{url}"
limit:
  raw: 500
