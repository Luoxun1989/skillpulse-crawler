id: community_skillhub
section: community
display_name: "SkillHub AI Skills（按评分，需 playwright 绕过 Cloudflare）"
enabled: true
interval: weekly
fetcher:
  type: playwright
  url: https://www.skillhub.cn/skills?sortBy=score
  headers:
    Accept-Language: zh-CN,zh;q=0.9
  timeout_sec: 60
extractor:
  type: xpath
  item_selector: "//a[contains(@href,'/skills/') and contains(@href,'/') and string-length(substring-after(substring-after(@href,'/skills/'),'/'))>2]"
  fields:
    title: ".//span[contains(@class,'font-heading') and contains(@class,'truncate')]/text()"
    url: "./@href"
    summary: ".//*[@data-testid='skill-list-item-description']/text()"
    likes_count: ".//*[contains(@class,'lucide-star')]/following-sibling::span[1]/text()"
    source_id: "./@data-slug"
mapping:
  source: "SkillHub"
  source_id:
    expr: "./@data-slug"
  url_template: "https://www.skillhub.cn{url}"
limit:
  raw: 500
