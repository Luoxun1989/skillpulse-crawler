id: paper_arxiv
section: paper
display_name: "arXiv cs.AI"
enabled: false  # 真实环境因网络无法访问 export.arxiv.org，保持禁用直到 mirror 方案
interval: weekly
fetcher:
  type: rss
  url: http://export.arxiv.org/rss/cs.AI
  timeout_sec: 30
extractor:
  type: rss
  fields:
    summary: rss
    published_date: rss
mapping:
  source: "arXiv"
  source_id:
    expr: "fn:arxiv_id_from_url"
limit:
  raw: 500
