id: news_36kr_ai
section: news
display_name: "36 氪 AI 频道"
enabled: true
interval: weekly
fetcher:
  type: http
  url: https://www.36kr.com/information/AI
  headers:
    Accept-Language: zh-CN,zh;q=0.9
  timeout_sec: 30
extractor:
  type: xpath
  item_selector: "//a[starts-with(@href,'/p/') and string-length(@href) > 5]"
  fields:
    title: "./text()"
    url: "./@href"
    source_id: "./@href"
mapping:
  source: "36氪 AI"
  source_id:
    expr: "./@href"
  url_template: "https://www.36kr.com{url}"
limit:
  raw: 500
