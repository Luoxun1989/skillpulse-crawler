id: paper_aihot
section: paper
display_name: "AIHOT 论文榜（aihot.news/?category=paper）"
enabled: true
interval: weekly
fetcher:
  type: playwright
  url: https://aihot.news/?category=paper&page=1
  headers:
    Accept-Language: zh-CN,zh;q=0.9
  timeout_sec: 45
extractor:
  type: xpath
  item_selector: "//article"
  fields:
    title: ".//a[1]/text() | .//h2/text() | .//h3/text()"
    url: ".//a[1]/@href"
    summary: ".//p/text()"
    source_id: ".//a[1]/@href"
mapping:
  source: "AIHOT"
  source_id:
    expr: ".//a[1]/@href"
  url_template: "https://aihot.news{url}"
limit:
  raw: 30
  top: 10
