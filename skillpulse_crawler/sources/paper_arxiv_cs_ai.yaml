id: paper_arxiv_cs_ai
section: paper
display_name: "arXiv cs.AI 每日新论文"
enabled: true
interval: weekly
fetcher:
  type: rss
  url: https://export.arxiv.org/rss/cs.AI
  timeout_sec: 30
extractor:
  type: rss
  fields:
    published_date: rfc2822
    summary: ""
mapping:
  source: "arXiv cs.AI"
  source_id:
    expr: "./link"
limit:
  raw: 500
